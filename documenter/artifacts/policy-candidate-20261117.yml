# DRAFT policy candidate for Tier 2+ activation — NOT the live policy.
# Produced as Authorization Workflow step 2 (policy-reference §Authorization
# Workflow) for operator review; the operator performs the live edit of
# documenter_policy.yml out-of-session (steps 4-5). The live policy stays at
# active_tier: 1 until that act.
# Updated 2026-11-17 post-AI-1: adds allow_solo_approval +
# min_approval_delay_seconds (ADR-017), and narrows allowed_operations to
# the consensus OQ-2 pilot scope (variant A+B, safe-only, no wildcards).
# Schema: docs/en/documenter-service/policy-reference.md §Policy File.
documenter_policy:
  version: "0.2.0"
  active_tier: 2                      # operator sets this only together with briefing_ref (step 5)
  allowed_operations:
    # ADR-017 pilot (consensus sess-solo-operator-activation, OQ-2 variant
    # A+B): mechanical metadata updates only, safe trust only, on exactly
    # the two pilot manifest IDs. Widening only after 5 clean cycles, one
    # change_type or one document per expansion (briefing §5 commitment).
    - type: operation
      change_type: update
      trust_level: safe
      targets:
        - documenter-service-configuration-guide
        - operator-surface
      requires_diff_preview: true
  audit_freshness: 30
  approval_expiry_window: 30
  rescan_batch_ceiling: 50
  max_diff_bytes: 524288
  sync_latency_budget_ms: 30000
  lock_wait_timeout: 30
  operator_approval_timeout: 300
  notification_mode: inline
  glossary_enforcement: draft
  # ADR-017 solo-operator bounded experiment (fail-closed defaults in core;
  # explicit values here record the operator's risk-acceptance act):
  allow_solo_approval: true           # operator's explicit risk acceptance (briefing §5)
  min_approval_delay_seconds: 300     # consensus floor 300; range [60, 86400]
  # Operator must archive the briefing (documenter/artifacts/
  # operator-briefing-20261117.md — signed 2026-11-17) and set the path in
  # the SAME edit that advances active_tier (step 5):
  briefing_ref: documenter/artifacts/operator-briefing-20261117.md
