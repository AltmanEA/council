# Changelog storage: CHANGELOGS/<id>.changes.md — one file per document with its change history.
#   Changelogs remain at repository root (operational artifact shared by all documents).
#   Agents read changelogs on-demand when editing corresponding documents (§2.5 Changelog Storage in AGENTS.md).

