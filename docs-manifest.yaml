# Changelog storage: CHANGELOGS/<id>.changes.md — one file per document with its change history.
#   Agents read changelogs on-demand when editing corresponding documents (§X Changelog Storage).

# Cross-references:
# - protocol-core/index.md references project-concept/index.md (Role Model inherits from "Roles are assigned based on task context")
# - fallback/index.md references protocol-core/index.md (uses the same 5-phase interaction protocol structure)
# - fallback/index.md defines operational procedure for subagent-based execution before Moderator is implemented
# - glossary/index.md defines terms used across all documents above
# - scenario/index.md references glossary/index.md (Scenario term definition), protocol-core/index.md (base five-phase protocol structure, Role Activation Rules)
# - RU files (index-RU.md) mirror EN source files; synced date tracked manually via git diff
# - platform-direction (protocol-core/platform-direction-analysis.md) analyzes all three platform approaches through reliability & security dimensions; referenced by protocol-core, fallback-mode, project-reference
# - architect-analysis (architect-analysis/index.md) evaluates structural/escalation path implications of each platform approach
# - human-centric-analysis (human-centric-analysis/index.md) evaluates interaction modalities, cognitive load, trust calibration for operator-facing architecture decisions
# - planned-architecture/ (index + layer-0, layer-1, layer-2, decisions/) consolidated view of accepted multi-layered architecture with six B-derived integrations; cross-references: decisions/index.md references platform-architecture/index.md (ADR rationale), layer-0.md / layer-1.md / layer-2.md reference index.md
