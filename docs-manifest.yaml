# Changelog storage: CHANGELOGS/<id>.changes.md — one file per document with its change history.
#   Agents read changelogs on-demand when editing corresponding documents (§X Changelog Storage).

# Cross-references:
# - protocol-core/index.md references project-concept/index.md (Role Model inherits from "Roles are assigned based on task context")
# - fallback/index.md references protocol-core/index.md (uses the same 5-phase interaction protocol structure)
# - fallback/index.md defines operational procedure for subagent-based execution before Moderator is implemented
# - glossary/index.md defines terms used across all documents above
# - scenario/index.md references glossary/index.md (Scenario term definition), protocol-core/index.md (base five-phase protocol structure, Role Activation Rules)
# - RU files (index-RU.md) mirror EN source files; synced date tracked manually via git diff
# - planned-architecture/ (index + layer-0, layer-1, layer-2, decisions/) consolidated view of accepted multi-layered architecture; layer files reference index.md; decisions/index.md is the stable cross-reference point for ADR-001–005
# - documenter-service/ three-document set: index.md (protocol: interfaces, trust tiers, safety protocol) → policy-reference.md (reference: policy file schema, operational tuning, authorization workflow) → configuration-guide.md (reference: hash store, intent record, event schema, compliance modes). Policy fields are defined once in policy-reference and consumed by the other two by name.
# - Pre-implementation spec set (sess-services-readiness): service-contract/index.md defines artifact/event/error schemas consumed by execution-runtime/index.md (Layer 1 runtime, persistence, lifecycle) and operator-surface/index.md (MCP stdio transport, identity, escalation, Documenter invocation). Ordering: service-contract → execution-runtime → operator-surface.
