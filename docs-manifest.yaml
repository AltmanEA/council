# Documentation Manifest
# Single source of truth for project documentation layout.
#
# Language layout: English originals under docs/en/, Russian translations under docs/ru/.
# Translations use mirrored directory structure (same nesting as English).
# has_translation field uses relative path from manifest location to the RU file.
# Schema change v0.2: has_translation changed from bare filename to relative path
# to support separated language directories (ru-restructure consensus, 2026-11-10).

documents:
