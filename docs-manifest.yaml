# Cross-references:
# - docs/protocol-core/index.md references docs/project-concept/index.md (Role Model inherits from "Roles are assigned based on task context")
# - docs/fallback/index.md references docs/protocol-core/index.md (uses the same 5-phase interaction protocol structure)
# - docs/fallback/index.md defines operational procedure for subagent-based execution before Moderator is implemented
# - docs/glossary/index.md defines terms used across all documents above
# - docs/scenario/index.md references docs/glossary/index.md (Scenario term definition), docs/protocol-core/index.md (base five-phase protocol structure, Role Activation Rules)
# - RU files (index-RU.md) mirror EN source files; synced date tracked manually via git diff
# - docs/planned-architecture/ (index + layer-0, layer-1, layer-2, decisions/) consolidated view of accepted multi-layered architecture; layer files reference index.md; decisions/index.md is the stable cross-reference point for ADR-001–005
# - documenter-service/ three-document set (operational, not in manifest): index.md (protocol: interfaces, trust tiers, safety protocol) → policy-reference.md (reference: policy file schema, operational tuning, authorization workflow) → configuration-guide.md (reference: hash store, intent record, event schema, compliance modes). Policy fields are defined once in policy-reference and consumed by the other two by name.
# - Pre-implementation spec set (sess-services-readiness): docs/service-contract/index.md defines artifact/event/error schemas consumed by docs/execution-runtime/index.md (Layer 1 runtime, persistence, lifecycle) and docs/operator-surface/index.md (MCP stdio transport, identity, escalation, Documenter invocation). Ordering: service-contract → execution-runtime → operator-surface.
# - Documenter operational state: documenter/ directory (hashes.json, intent/, audits.json) — not in manifest, explicitly excluded from Documenter audit scope per consensus-non-controlled-files.md.
# - Operational files (not in manifest): AGENTS.md, fallback/, documenter-service/, .agents/, .opencode/, CHANGELOGS/, defaults/, archive/, tests/, consensus-non-controlled-files.md, notes.md, session files (sessions/<id>/).
