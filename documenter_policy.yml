# Documenter Service MVP policy — Tier 0/1 read-only scaffold (Stage 4).
# Schema: docs/en/documenter-service/policy-reference.md §Policy File.
# Load-time rules: docs/en/documenter-service/mvp-data-models.md §2 (7 rules,
# fail closed). This file MUST satisfy every rule at active_tier <= 1:
# allowed_operations stays empty below Tier 2, briefing_ref is null, and all
# integer fields are positive. The Documenter never loads defaults/policy.yaml
# (framework-wide whitelist — not a Documenter policy file).
documenter_policy:
  version: "0.2.0"
  active_tier: 1                      # 0 = audit only; 1 = + diff preview (MVP)
  allowed_operations: []              # inert below Tier 2; MUST be empty at Tier 0-1
  audit_freshness: 30                 # minutes; delegate() pre-audit gate window
  approval_expiry_window: 30          # minutes (Tier 2+; reserved field)
  rescan_batch_ceiling: 50            # documents per full-rescan invocation
  max_diff_bytes: 524288              # 512 KiB decoded diff cap
  sync_latency_budget_ms: 30000       # synchronous call budget (MVP scans are fast)
  lock_wait_timeout: 30               # seconds (Tier 2+ advisory lock; reserved)
  operator_approval_timeout: 300      # seconds (Tier 2+; reserved)
  notification_mode: inline           # inline is the only accepted value
  glossary_enforcement: draft         # noise-reduction mode (rule 3 is AI-reserved)
  briefing_ref: null                  # MUST be non-null when active_tier >= 2
